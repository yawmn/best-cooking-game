<!doctype html>
<!--
  Kuroshio Express: Ekiben Bento — architecture:
  RECIPES (4 bento boxes) · STATIONS (rice/grill/fryer cookers) ·
  BENTO_ASSEMBLY (one compartment per recipe ingredient) ·
  STATION_RUSH (+50% tips in the 12 s before each stop) ·
  PROCEDURAL_CANVAS_ART (all art drawn in code) · WEB_AUDIO_SFX (synth, no files).
  No external assets, no network, no copied art/music/names.
  Entry point: a full-screen canvas, game logic in src/main.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuroshio Express: Ekiben Bento</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1B365D; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kuroshio Express: Ekiben Bento — cook and serve bento boxes on a coastal train"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
